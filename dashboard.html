<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Wolt</title>
    <link rel="shortcut icon" href="https://careers.wolt.com/favicon.ico" type="image/x-icon">
    <link href="./assets/css/output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script>
        const loggedin = localStorage.getItem('loggedin')

        if(!loggedin) {
            window.location.href = `/login.html`
        }
    </script>
</head>
<body>
    
    <header>
        <nav class="relative bg-white shadow dark:bg-gray-800">
            <div class="container py-4 mx-auto md:flex md:justify-between md:items-center">
                <div class="flex items-center justify-between">
                    <a href="index.html">
                        <img src="assets/images/logo.png" alt="Wolt logo" class="h-18" />
                    </a>
                </div>
                <div class="absolute inset-x-0 z-20 w-full py-4 transition-all duration-300 ease-in-out bg-white dark:bg-gray-800 md:mt-0 md:p-0 md:top-0 md:relative md:bg-transparent md:w-auto md:opacity-100 md:translate-x-0 md:flex md:items-center">
                    <div class="flex flex-col md:flex-row">
                        <a class="my-2 text-gray-700 transition-colors duration-300 transform dark:text-gray-200 hover:text-blue-500 dark:hover:text-blue-400 md:mx-4 md:my-0" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back</a>
                        <button class="my-2 text-gray-700 transition-colors duration-300 transform dark:text-gray-200 hover:text-blue-500 dark:hover:text-blue-400 md:mx-4 md:my-0" id="logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class=" bg-linear-to-r to-cyan-500 from-blue-600 py-12">
        <div class="container mx-auto flex justify-between items-start gap-20">
            <h1 class="text-4xl font-bold text-white">
                Dashboard
            </h1>
            <p class="text-gray-200">
                Loggedin user: <span id="email" class="font-semibold"></span>
            </p>
        </div>
    </main>

    <section class="py-20">
        <div class="container mx-auto">
            <table class="w-full table" id="orders">

            </table>
        </div>
    </section>

    <footer class="bg-white dark:bg-gray-900 border-t border-gray-200">
    </footer>

    <script type="module">
        import Footer from "./modules/Footer.js"

        document.querySelector('footer').innerHTML = Footer()

        const email = localStorage.getItem('email')

        document.querySelector('span#email').textContent = email

        const logout_btn = document.querySelector('#logout')

        logout_btn.addEventListener('click', event => {
            if(confirm('Are you sure?')) {
                localStorage.removeItem('email')
                localStorage.removeItem('loggedin')
                
                window.location.href = `/index.html`
            }
        })


        // Render (display) orders
        const orders = localStorage.getItem('orders') === null ? [] : JSON.parse(localStorage.getItem('orders'))
        const orders_table = document.querySelector('table#orders')

        const user_orders = orders.filter(order => order.email == email)

        let orders_html = ''

        if(user_orders.length > 0) {
            for(let order of user_orders) {
                orders_html += `
                    <tr>
                        <td class="border border-gray-300 px-6 py-2">${order.email}</td>
                        <td class="border border-gray-300 px-6 py-2 text-right">${order.phoneNumber}</td>
                        <td class="border border-gray-300 px-6 py-2 text-right">${order.deliveryAddress}</td>
                        <td class="border border-gray-300 px-6 py-2 text-right">${order.products.length} product(s)</td>
                    </td>
                `
            }

            orders_table.innerHTML = orders_html
        } else {
            orders_table.innerHTML = `
            <tr>
                <td class="border border-gray-300 px-6 py-2 text-center">0 Orders</td>
            </tr>
            `
        }
    </script>
</body>
</html>
